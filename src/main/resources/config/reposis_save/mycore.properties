# The following properties are required for (productive) save deployment.
# For productive deployment, all properties must be configured or enabled.
# Only relevant properties should be listed here; otherwise, they should be deleted.
# Unless otherwise specified, empty properties are relevant and must be configured.
# Temporary disabled properties require further configuration or other dependencies.

##############################################################################
# Basic                                                                      #
##############################################################################
# Configure base url, e.g. http://domain:port, without '/'. Temporary disabled to use default.
#MCR.baseurl=
# Requires MCR.baseurl, therefore temporary disabled.
#MIR.CanonicalBaseURL=%MCR.baseurl%/
MCR.NameOfProject=save
MCR.Metadata.Languages=de,en

##############################################################################
# Mail                                                                       #
##############################################################################
MCR.Mail.Server=
# General sender mail address, e.g. mail@domain
MCR.Mail.Sender=

# Mail for events including self registration, e.g. <name> mail@domain
MCR.mir-module.EditorMail=
# Sender email for events, e.g. <name> mail@domain
MCR.mir-module.MailSender=

##############################################################################
# Workflow                                                                   #
##############################################################################
MIR.Workflow.Menu=true
MIR.Workflow.Box=true

##############################################################################
# Editor                                                                     #
##############################################################################
MIR.EditorForms.CustomIncludes=%MIR.EditorForms.CustomIncludes%,xslStyle:editor/mir2xeditor:webapp:editor/editor-customization.xed

##############################################################################
# Frontend                                                                   #
##############################################################################
MIR.CustomLayout.JS=save.js
# Enable custom elements
MCR.URIResolver.xslIncludes.MyCoReWebPage=%MCR.URIResolver.xslIncludes.MyCoReWebPage%,save/html/content-templates.xsl

# Customize badges
MCR.URIResolver.xslImports.badges=mir/badges/base.xsl,mir/badges/date.xsl,save/badges/institution.xsl,\
  save/badges/resource-type.xsl

# Customize fields
MCR.URIResolver.xslIncludes.metadatabox=%MCR.URIResolver.xslIncludes.metadatabox%,\
  save/object-page/boxes/metadata/genre.xsl,save/object-page/boxes/metadata/location.xsl
MIR.MetadataBox.Fields=title,location.shelf,subject.geographic,subject,name,dates.issued,identifier,\
  physical-description.form,physical-description.note,physical-description,note,genre,\
  location.physical.creation,location.physical.discovery

##############################################################################
# Disable Servlets                                                           #
##############################################################################
MCR.Servlet.OAI2.Disabled=true
MCR.Servlet.MirSelfRegistrationServlet.Disabled=true

##############################################################################
# Misc                                                                       #
##############################################################################
# Enable custom x-isil label.
MCR.classeditor.additionalLanguages=%MCR.classeditor.additionalLanguages%,x-isil,x-gnd

##############################################################################
# Solr                                                                       #
##############################################################################
# Enable custom indexing
MCR.URIResolver.xslImports.solr-document=%MCR.URIResolver.xslImports.solr-document%,save/solr/indexing/fields.xsl
